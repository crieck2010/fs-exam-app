name: fs_exam_app
description: FS exam quiz practice app for iOS and Android — Phase 2 of the FS Exam Prep program.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^22.0.0
  flutter_timezone: ^5.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/banks/
